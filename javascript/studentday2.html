<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Calculator</title>
</head>
<body>
    <h1>Student Grade Calculator</h1>
    <button onclick="calculateGrade()">Calculate Grade</button>
    <script>
        function calculateGrade() {
            let studentName = prompt("Enter the student's name:");
            let mathsScore = Number(prompt("Enter the student's score in maths:"));
            let scienceScore = Number(prompt("Enter the student's score in science:"));
            let englishScore = Number(prompt("Enter the student's score in english:"));
            let averageScore = (mathsScore + scienceScore + englishScore) / 3;
        let grade;
        if (averageScore >= 90) {
            grade = "A";
        } else if (averageScore >= 80) {
            grade = "B";
        } else if (averageScore >= 70) {
            grade = "C";
        } else if (averageScore >= 60) {
            grade = "D";
        } else {
            grade = "F";
        }
        alert(`Student: ${studentName}\nAverage Score: ${averageScore}\nGrade: ${grade}`);
    }
</script>
</body>
</html>
