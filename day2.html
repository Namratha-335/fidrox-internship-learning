<!DOCTYPE html>
<html>
<head>
    <title>Employee Registration Form</title>
    <link rel="stylesheet" href="day2.css">
</head>
<body>
    <h2 class="form-title">Employee Registration Form</h2>
    <h3 class="form-title1">Employee Personal Information</h3>
    <form>
        <label for="name">First Name:</label>
        <input type="text" id="name" name="name" required><br><br>  
        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" name="lastname" required><br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required><br><br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>    
        <label>Gender:</label><br>
        <label><input type="radio" id="gender" name="gender" value="male"> Male</label>
        <label><input type="radio" id="gender" name="gender" value="female"> Female</label><br><br>
        <label for="photo">Photo:</label>
        <input type="file" id="photo" name="photo" accept="image/*"><br><br>
        <h3 class="form-title1">Address Information</h3>
        <textarea id="address" name="address" rows="4" cols="50" placeholder="Enter your address here..." required></textarea><br><br>
        <input type="text" id="city" name="city" placeholder="City" required><br><br>
        <label for="state">State:</label>
        <select id="state" name="state" required>
            <option value="">Select State</option>
            <option value="state1">Karnataka</option>
            <option value="state2">Tamil Nadu</option>
            <option value="state3">Andhra Pradesh</option>
        </select><br><br>
        <h3 class="form-title1">Other Information</h3>
        <label for="department">Department:</label>
        <select id="department" name="department" required>
            <option value="">Select Department</option>
            <option value="dept1">Human Resources</option>
            <option value="dept2">Finance</option>  
            <option value="dept3">Engineering</option>
        </select><br><br>
        <label for="experience">Years of Experience:</label>
        <input type="number" id="experience" name="experience" min="0" required><br><br>
        <label for="skills">Skills:</label><br>
        <label><input type="checkbox" id="skills" name="skills" value="programming"> Programming</label><br>
        <label><input type="checkbox" id="skills" name="skills" value="communication"> Communication</label><br><br>
        <button class="form-title">Submit</button>
        <button class="form-title" type="reset">Reset</button>
    </form>
</body>
</html>
